[project]
name = "contentprocessor"
version = "0.1.0"
description = "Content Process Gold Standard Solution Accelerator - Content Processing Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework==1.3.0",
    "azure-ai-inference==1.0.0b9",
    "azure-appconfiguration==1.9.0",
    "azure-identity==1.26.0b2",
    "azure-monitor-opentelemetry==1.8.9",
    "azure-storage-blob==12.30.0",
    "azure-storage-queue==12.17.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "opentelemetry-api==1.43.0",
    "pandas==3.0.5",
    "pdf2image==1.17.0",
    "poppler-utils==0.1.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pymongo==4.17.0",
    "python-dotenv==1.2.2",
    "tiktoken==0.13.0",
    "protobuf==6.33.6",
    "pyjwt==2.13.0",
    "pyasn1==0.6.4",
]


[dependency-groups]
dev = [
    "coverage==7.15.2",
    "pydantic==2.13.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "mongomock==4.3.0",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
minversion = "8.3.4"
addopts = "-v --strict-markers --maxfail=5"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.poetry.scripts]
start-app = "src.main:main"
