[project]
name = "contentprocessor"
version = "0.1.0"
description = "Content Process Gold Standard Solution Accelerator - Content Processing Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.3.0",
    "agent-framework-openai==1.1.1",
    "aiohttp==3.14.4",
    "azure-ai-inference==1.0.0b9",
    "azure-appconfiguration==1.9.0",
    "azure-identity==1.26.0b2",
    "azure-monitor-opentelemetry==1.8.9",
    "azure-storage-blob==12.30.0",
    "azure-storage-queue==12.17.0",
    "certifi==2026.10.18",
    "charset-normalizer==3.4.9",
    "jinja2==3.1.6",
    "opentelemetry-api==1.43.0",
    "pandas==3.0.5",
    "pdf2image==1.17.0",
    "poppler-utils==0.1.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pymongo==4.18.3",
    "python-dotenv==1.2.2",
    "tenacity==9.1.4",
    "tiktoken==0.13.0",
    "protobuf==6.33.6",
    "pyjwt==2.15.0",
    "pyasn1==0.6.5",
]


[dependency-groups]
dev = [
    "coverage==7.15.2",
    "pydantic==2.13.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "mongomock==4.3.0",
    "ruff==0.16.0",
]

[tool.uv]
constraint-dependencies = [
    "dnspython>=2.9.0",
    "pillow>=13.0.0",
]

[tool.uv.sources]
# The patched release is not yet available from the Microsoft feed.
pyasn1 = { url = "https://github.com/pyasn1/pyasn1/releases/download/v0.6.5/pyasn1-0.6.5-py3-none-any.whl" }

[[tool.uv.index]]
name = "microsoft-package-feed-proxy"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.pytest.ini_options]
minversion = "8.3.4"
addopts = "-v --strict-markers --maxfail=5"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.poetry.scripts]
start-app = "src.main:main"
